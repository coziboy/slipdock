# Builds Slipdock.app for Apple Silicon and attaches it to a GitHub Release.
#
# - Push a tag like v0.1.0: builds, then creates the release with the zip.
# - Run by hand (Actions > release > Run workflow): builds and keeps the zip
#   as a workflow artifact, with no release.
#
# The app is sealed with an ad hoc signature and is not notarized. The README
# section "Install" tells the user how to open it the first time.
#
# Caching: cargo-bundle and the compiled dependencies are kept between runs.
# GitHub lets a run read the caches of its own ref and of the default branch
# only, so a cache saved by one tag is of no use to the next tag. The caches
# are therefore saved by runs on main, and a tag run only reads them. To fill
# or refresh them, run the workflow by hand on main (before a release, or
# after the dependencies changed). A run without a cache still works; it
# just takes about 15 minutes.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP: target/release/bundle/osx/Slipdock.app
  ZIP: Slipdock-macos-arm64.zip
  CARGO_BUNDLE_VERSION: 0.12.0

jobs:
  macos:
    runs-on: macos-latest # Apple Silicon
    steps:
      - uses: actions/checkout@v4

      # rustup reads rust-toolchain.toml and fetches the pinned compiler.
      - name: Show the toolchain
        run: rustup show

      # The dependencies: the downloaded crates and what was compiled from
      # them in target/. The key holds the compiler version and Cargo.lock,
      # so a change of either starts from the nearest older cache. The
      # crates of this repository are always compiled again.
      - name: Restore the compiled dependencies
        uses: Swatinem/rust-cache@v2
        with:
          # cargo-bundle has its own cache below.
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Building cargo-bundle takes about 8 minutes, and it changes only
      # when its version here does.
      - name: Restore cargo-bundle
        id: cargo-bundle
        uses: actions/cache/restore@v4
        with:
          path: ~/.cargo/bin/cargo-bundle
          key: cargo-bundle-${{ env.CARGO_BUNDLE_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install cargo-bundle
        if: steps.cargo-bundle.outputs.cache-hit != 'true'
        run: cargo install cargo-bundle --locked --version "$CARGO_BUNDLE_VERSION"

      - name: Save cargo-bundle
        if: steps.cargo-bundle.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ~/.cargo/bin/cargo-bundle
          key: ${{ steps.cargo-bundle.outputs.cache-primary-key }}

      # Must run from the repository root, or cargo-bundle leaves out the
      # icon and Info.ext.plist without an error.
      - name: Build the bundle
        run: cargo bundle --release -p slipdock-app --format osx

      - name: Sign with an ad hoc signature
        run: codesign --force --sign - "$APP"

      - name: Verify the bundle is whole
        run: |
          test -f "$APP/Contents/Resources/Slipdock.icns"
          plutil -extract LSEnvironment.PATH raw "$APP/Contents/Info.plist"
          codesign --verify --verbose "$APP"
          lipo -archs "$APP/Contents/MacOS/"*

      # ditto keeps the bundle layout and the signature; plain zip may not.
      - name: Zip the app
        run: ditto -c -k --keepParent "$APP" "$ZIP"

      - name: Keep the zip as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Slipdock-macos-arm64
          path: ${{ env.ZIP }}

      - name: Create the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$ZIP" --title "$GITHUB_REF_NAME" --generate-notes
